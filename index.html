<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="reay.io" />
    <title>reay.io</title>
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Switch to light mode">
      <span class="theme-toggle__track" aria-hidden="true">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.5" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24">
          <path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z" />
        </svg>
        <span class="theme-toggle__thumb"></span>
      </span>
    </button>

    <main class="page-shell">
      <h1 class="sr-only">reay.io</h1>
      <div class="art-stage">
        <img class="ansi-art ansi-art--glow" src="./chrome.png" alt="" aria-hidden="true" />
        <img class="ansi-art ansi-art--main" src="./chrome.png" alt="reay.io ANSI artwork" />
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
